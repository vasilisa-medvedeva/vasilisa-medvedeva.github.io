<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ButtonDoodle · Start</title>
<link rel="stylesheet" href="../styles/color-tokens.css" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:56px;flex-wrap:wrap;
       background:var(--color-constant-primary);font-family:system-ui,sans-serif}
  .col{display:flex;flex-direction:column;align-items:center;gap:12px}
  .cap{font-size:12px;color:var(--color-primary-transparent-48);letter-spacing:.4px;text-transform:uppercase}

  /* ── ButtonDoodle — Start (filled, hand-drawn) ──
     Standalone asset (not a library component). Fill colour is the design's own
     #84C0FF, not a design-system token; ink (text + border) = --color-primary.
     The rect inherits `fill`; the paths are `fill:none` + `stroke:currentColor`. */
  .doodle-btn{
    all:unset; box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center;
    min-height:44px; cursor:pointer; border-radius:14px;
    --fill:#84C0FF;
    color:var(--color-primary);
    transition:transform .1s ease, filter .12s ease;
  }
  .doodle-btn svg{display:block; height:40px; width:auto; fill:var(--fill);}
  .doodle-btn:hover{ filter:brightness(0.94); }
  .doodle-btn:active{ transform:scale(.97); filter:brightness(0.88); }
  .doodle-btn:focus-visible{ outline:2px solid var(--color-primary-transparent-87); outline-offset:3px; }
  .doodle-btn:disabled{ cursor:default; filter:grayscale(.6) opacity(.5); }
  @keyframes doodle-wobble{0%{transform:rotate(0)}25%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}75%{transform:rotate(-1deg)}100%{transform:rotate(0)}}
  .doodle-btn.is-clicked{animation:doodle-wobble .35s ease;}
</style>
</head>

  <div class="col">
    <div class="cap">Default · hover · press</div>
    <button class="doodle-btn" aria-label="Start"
            onclick="this.classList.remove('is-clicked');void this.offsetWidth;this.classList.add('is-clicked')">
      <svg viewBox="0 0 266 62"><use href="#ico-start"/></svg>
    </button>
