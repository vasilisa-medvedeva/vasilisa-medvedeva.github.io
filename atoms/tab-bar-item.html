<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atom: TabBarItem</title>
  <link rel="stylesheet" href="../styles/color-tokens.css" />
  <link rel="stylesheet" href="../styles/text-tokens.css" />
  <style>
    body {
      display: flex;
      gap: 32px;
      padding: 40px;
      background: #fff;
      align-items: center;
    }

    /* ── TabBarItem ── */
    .tab-bar-item {
      position: relative;
      width: 72px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* highlight circle — only visible when pressed */
    .tab-bar-item__highlight {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--color-brand-yellow-24); /* brandYellow/24 #FFEECB */
      top: 50%;
      left: 50%;
      transform: translate(-50%, calc(-50% - 4px));
      display: none;
    }

    .tab-bar-item--pressed .tab-bar-item__highlight {
      display: block;
    }

    /* icon layout */
    .tab-bar-item__layout {
      position: absolute;
      left: 2px;
      right: 2px;
      top: 50%;
      transform: translateY(-50%);
      padding-bottom: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tab-bar-item__icon {
      position: relative;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
    }

    /* SVG icon — group of people */
    .tab-bar-item__icon svg {
      width: 23.5px;
      height: 18.12px;
      color: var(--color-primary-transparent-87); /* primary/transparent87 #212121 */
    }
  </style>
</head>
<body>

  <!-- Default state -->
  <div class="tab-bar-item">
    <div class="tab-bar-item__highlight"></div>
    <div class="tab-bar-item__layout">
      <div class="tab-bar-item__icon">
        <svg viewBox="0 0 24 19" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M17 9C18.66 9 19.99 7.66 19.99 6C19.99 4.34 18.66 3 17 3C15.34 3 14 4.34 14 6C14 7.66 15.34 9 17 9ZM9 9C10.66 9 11.99 7.66 11.99 6C11.99 4.34 10.66 3 9 3C7.34 3 6 4.34 6 6C6 7.66 7.34 9 9 9ZM9 11C6.67 11 2 12.17 2 14.5V16H16V14.5C16 12.17 11.33 11 9 11ZM17 11C16.71 11 16.38 11.02 16.03 11.05C17.19 11.89 18 13.02 18 14.5V16H22V14.5C22 12.17 17.33 11 17 11Z" fill="currentColor"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Pressed state -->
  <div class="tab-bar-item tab-bar-item--pressed">
    <div class="tab-bar-item__highlight"></div>
    <div class="tab-bar-item__layout">
      <div class="tab-bar-item__icon">
        <svg viewBox="0 0 24 19" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M17 9C18.66 9 19.99 7.66 19.99 6C19.99 4.34 18.66 3 17 3C15.34 3 14 4.34 14 6C14 7.66 15.34 9 17 9ZM9 9C10.66 9 11.99 7.66 11.99 6C11.99 4.34 10.66 3 9 3C7.34 3 6 4.34 6 6C6 7.66 7.34 9 9 9ZM9 11C6.67 11 2 12.17 2 14.5V16H16V14.5C16 12.17 11.33 11 9 11ZM17 11C16.71 11 16.38 11.02 16.03 11.05C17.19 11.89 18 13.02 18 14.5V16H22V14.5C22 12.17 17.33 11 17 11Z" fill="currentColor"/>
        </svg>
      </div>
    </div>
  </div>

</body>
</html>
